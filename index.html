
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropGuard IoT Dashboard</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
        appId: "f33ba8cd-9ca4-42e9-b469-bbec2ebd1413",
       serviceWorkerPath: "/Smart-Crop-Protection-and-Animal-Intrusion-Alert-System/OneSignalSDKWorker.js",
        serviceWorkerParam: {
            scope: "/Smart-Crop-Protection-and-Animal-Intrusion-Alert-System/"
        }
    });
});
</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f8f1;
    color: #263528;
}

header {
    background: #1b5e20;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    margin-bottom: 0;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000012;
}

.card h2 {
    color: #1b5e20;
    margin-top: 0;
}

.status {
    color: #d97706;
    font-weight: bold;
}

button {
    background: #1b5e20;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 7px;
    cursor: pointer;
    margin: 5px;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

footer {
    text-align: center;
    padding: 20px;
    color: #667;
}
</style>
</head>

<body>

<header>
    <h1>🌱 CropGuard IoT</h1>
    <p>Smart Crop Protection and Animal Intrusion Alert System</p>
</header>

<div class="container">

    <div class="card">
        <h2>Welcome, Farmer!</h2>
        <p>Monitor and manage your smart crop protection system.</p>
    </div>

    <div class="card">
    <h2>1. System Control</h2>

    <p>Protection System Status:
        <span class="status" id="systemStatus">Checking...</span>
    </p>

    <input type="password" id="controlPassword"
           placeholder="Enter group control password">

    <br>

    <button id="onButton">Turn ON</button>
    <button id="offButton">Turn OFF</button>

    <p id="controlMessage"></p>
</div>

    

    <div class="card">
        <h2>2. Captured Images</h2>

<div id="imageGallery">
    <p>Loading captured images...</p>
</div>
    </div>

</div>

<footer>
    CropGuard IoT | Smart Agriculture Project
</footer>
    
<script>
(() => {

    const SUPABASE_URL = "https://rchgoakaisdhndoumdoo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_njHcJLuu6v8L1rTqCIWivw_ydU9Y_Li";

    const sbClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadStatus() {
        const status = document.getElementById("systemStatus");

        try {
            const { data, error } = await sbClient
                .from("Device_status")
                .select("is_enabled")
                .eq("id", 1)
                .maybeSingle();

            if (error) throw error;

            status.textContent = data?.is_enabled ? "ON" : "OFF";

        } catch (error) {
            console.error("Status loading error:", error);
            status.textContent = "Connection Error";
        }
    }

    async function controlSystem(enabled) {
        const password =
            document.getElementById("controlPassword").value;

        const message =
            document.getElementById("controlMessage");

        if (!password) {
            message.textContent =
                "Please enter the group control password.";
            return;
        }

        message.textContent = "Sending command...";

        try {
            const { data, error } =
                await sbClient.functions.invoke(
                    "cropguard-control",
                    {
                        body: {
                            password: password,
                            enabled: enabled
                        }
                    }
                );

            if (error) throw error;

            if (data && data.success) {
                document.getElementById("systemStatus").textContent =
                    data.is_enabled ? "ON" : "OFF";

                message.textContent =
                    "System updated successfully.";
            } else {
                message.textContent =
                    data?.error || "Command failed.";
            }

        } catch (error) {
            console.error("Control error:", error);
            message.textContent = "Error: " + error.message;
        }
    }

    document.getElementById("onButton").addEventListener(
        "click", () => controlSystem(true)
    );

    document.getElementById("offButton").addEventListener(
        "click", () => controlSystem(false)
    );

    loadStatus();
    setInterval(loadStatus, 5000);
    let lastImageSignature = "";
    async function loadImages() {
    const gallery = document.getElementById("imageGallery");

    try {
        const { data, error } = await sbClient
            .storage
            .from("Cropguard-images")
            .list("", {
                limit: 50,
                sortBy: {
                    column: "created_at",
                    order: "desc"
                }
            });

        if (error) throw error;

        const images = data.filter(file =>
            /\.(jpg|jpeg|png|webp)$/i.test(file.name)
        );

        if (images.length === 0) {
            gallery.innerHTML = "<p>No captured images yet.</p>";
            return;
        }
        const imageSignature = images
    .map(file => file.name + file.created_at)
    .join("|");

if (imageSignature === lastImageSignature) {
    return;
}

lastImageSignature = imageSignature;

        gallery.innerHTML = "";

        for (const file of images) {
            const { data: signedData, error: urlError } =
                await sbClient.storage
                    .from("Cropguard-images")
                    .createSignedUrl(file.name, 3600);

            if (urlError) {
                console.error(urlError);
                continue;
            }

            const img = document.createElement("img");
            img.src = signedData.signedUrl;
            img.alt = "Captured animal image";
            img.style.cssText =
                "width:100%;max-width:400px;border-radius:10px;margin:10px;";

            gallery.appendChild(img);
            const time = document.createElement("p");

time.textContent = "Uploaded: " +
    new Date(file.created_at).toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
    });

time.style.cssText =
    "font-size:14px;color:#667;margin:0 10px 20px;";

gallery.appendChild(time);
        }

    } catch (error) {
        console.error("Image loading error:", error);
        gallery.innerHTML = "<p>Unable to load images.</p>";
    }
}

loadImages();
setInterval(loadImages, 30000);

})();
</script>
    </body>
</html>
